<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabellone Video Wall</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            background-color: black;
        }
        .container {
            position: absolute;
            /* MODIFICATO: -26px è la misura standard della barra Google */
            top: -26px; 
            left: 0;
            width: 100%;
            /* MODIFICATO: Compensa esattamente i 26px tolti */
            height: calc(100% + 26px); 
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- IL TUO LINK DEL PLAYER -->
        <iframe src="https://script.google.com/macros/s/AKfycbyzk8KIEuDKgoLDenE6b6ZVt_LKCKQZFcAeGJzttGbllfIq3MQfIC7fbKICJUFfkUDl/exec"></iframe>
    </div>
</body>
</html>
